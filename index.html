            "name": "Savollar bazasi rasmiymi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ha, saytdagi 1240 ta savol O'zbekiston DAN (Davlat Avtomobil Nazorati) rasmiy test bazasiga asoslangan va 2026-yilgi o'zgarishlarga moslab yangilangan."
            }
          },
          {
            "@type": "Question",
            "name": "Imtihon rejimi qanday ishlaydi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Rasmiy imtihon rejimida (Premium) 20 ta tasodifiy savol, 25 daqiqa vaqt beriladi. 2 tadan ortiq xato qilinsa (ya'ni 3-xatoda), real imtihondagi kabi test darhol tugaydi. Kengaytirilgan mashg'ulot rejimida esa savollar sonini, vaqt chegarasini (vaqtsiz ham bo'ladi) va ruxsat etilgan xatolar sonini (cheklanmagan ham bo'ladi) o'zingiz tanlaysiz."
            }
          },
          {
            "@type": "Question",
            "name": "Foydalanish bepulmi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Qisman. Bepul: 1–3-biletlar, kengaytirilgan rejimda mavzular bo'yicha mashq, yo'l belgilari to'plami va statistika. Premium: 4–62-biletlar, qat'iy rejim, rasmiy imtihon rejimi va xatolar ustida ishlash."
            }
          },
          {
            "@type": "Question",
            "name": "Natijalarim saqlanadimi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ha, ro'yxatdan o'tgan har bir foydalanuvchining urinishlari profiliga saqlanadi va har bir mavzu bo'yicha eng so'nggi natijani mavzular sahifasida ko'rish mumkin."
            }
          },
          {
            "@type": "Question",
            "name": "Telefon yoki planshetda ishlaydimi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ha, sayt barcha qurilmalarga (telefon, planshet, kompyuter) moslashgan va brauzer orqali qo'shimcha ilova o'rnatmasdan ishlatilaveradi."
            }
          },
          {
            "@type": "Question",
            "name": "Ro'yxatdan o'tish shartmi?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ha, mashq qilish uchun ro'yxatdan o'tish kerak. Buni Google hisobingiz yoki email va parol orqali bir necha soniyada qilasiz (email orqali ro'yxatdan o'tganda emailingizni tasdiqlash kerak). Shundan keyin natijalaringiz saqlanadi va progressni kuzatib borasiz."
            }
          }
